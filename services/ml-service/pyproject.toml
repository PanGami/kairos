[project]
name = "kairos-ml-service"
version = "0.1.0"
description = "KAIROS ml-service: gRPC server (GARCH-t + empirical interval + vol-implied M3)"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.60",
  "grpcio-health-checking>=1.60",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "arch>=6.2",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.60",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
