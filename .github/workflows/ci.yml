name: KAIROS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint protobuf contracts
        working-directory: api
        run: buf lint

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy arch pyarrow grpcio
      - name: Run ml-service golden tests
        run: python -m unittest discover -s services/ml-service/tests -v
      - name: Run ingestion validation tests
        run: python -m unittest discover -s services/ingestion/tests -v

  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Install protobuf compiler and Go plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.32.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate Go proto stubs and run tests
        working-directory: services/gateway
        run: |
          mkdir -p gen
          FORECAST_PKG="github.com/kairos/gateway/gen/kairos/forecast/v1;forecastv1"
          AUTH_PKG="github.com/kairos/gateway/gen/kairos/auth/v1;authv1"
          protoc -I ../../api/proto \
            --go_out=gen --go_opt=module=github.com/kairos/gateway/gen \
            --go_opt="Mkairos/forecast/v1/forecast.proto=${FORECAST_PKG}" \
            --go_opt="Mkairos/auth/v1/auth.proto=${AUTH_PKG}" \
            --go-grpc_out=gen --go-grpc_opt=module=github.com/kairos/gateway/gen \
            --go-grpc_opt="Mkairos/forecast/v1/forecast.proto=${FORECAST_PKG}" \
            --go-grpc_opt="Mkairos/auth/v1/auth.proto=${AUTH_PKG}" \
            ../../api/proto/kairos/forecast/v1/forecast.proto \
            ../../api/proto/kairos/auth/v1/auth.proto
          go mod tidy
          go vet ./...
          go test -v ./...

  auth-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Install protobuf compiler and Go plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate Go auth proto stubs and run tests
        working-directory: services/auth-service
        run: |
          mkdir -p gen
          AUTH_PKG="github.com/kairos/auth-service/gen/kairos/auth/v1;authv1"
          protoc -I ../../api/proto \
            --go_out=gen --go_opt=module=github.com/kairos/auth-service/gen \
            --go_opt="Mkairos/auth/v1/auth.proto=${AUTH_PKG}" \
            --go-grpc_out=gen --go-grpc_opt=module=github.com/kairos/auth-service/gen \
            --go-grpc_opt="Mkairos/auth/v1/auth.proto=${AUTH_PKG}" \
            ../../api/proto/kairos/auth/v1/auth.proto
          go mod tidy
          go vet ./...
          go test -v ./...

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build web assets
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [proto-lint, python-tests, gateway-tests, auth-service-tests, web-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build local Docker Compose images
        run: docker compose -f docker-compose.local.yml build
      - name: Run Trivy filesystem and config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
