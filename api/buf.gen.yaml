# Generate stub lokal (opsional; di Docker, generate terjadi di stage protogen).
# Jalankan dari folder api/: `buf generate`
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../services/gateway/gen
    opt: module=github.com/kairos/gateway/gen
  - remote: buf.build/grpc/go
    out: ../services/gateway/gen
    opt: module=github.com/kairos/gateway/gen
  - remote: buf.build/protocolbuffers/python
    out: ../services/ml-service/gen
  - remote: buf.build/grpc/python
    out: ../services/ml-service/gen
