openapi: 3.0.3
info:
  title: KAIROS Gateway API
  version: 1.0.0
  description: >
    REST API served by the gateway to the browser. Dashboard forecast routes require a valid session
    obtained via Google Sign-In (/v1/auth/google). Admin refresh requires X-Admin-Api-Key.
    The product is an end-of-day risk monitor, not investment advice.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200": { description: OK }
  /readyz:
    get:
      summary: Readiness probe (includes ml-service, auth-service & cache connectivity)
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /v1/auth/config:
    get:
      summary: Public auth client configuration (Google OAuth client ID and dev bypass status)
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /v1/auth/google:
    post:
      summary: Exchange a Google ID token for a KAIROS session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInResponse" }
        "401": { description: Invalid Google token }
  /v1/auth/me:
    get:
      summary: Current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { description: Unauthorized }
  /v1/auth/logout:
    post:
      summary: Revoke current user session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /v1/instruments:
    get:
      summary: List of instruments for dropdown
      security:
        - bearerAuth: []
      parameters:
        - name: only_active
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: List of instruments
          content:
            application/json:
              schema:
                type: object
                properties:
                  instruments:
                    type: array
                    items: { $ref: "#/components/schemas/Instrument" }
        "401": { description: Unauthorized }
  /v1/instruments/{id}/forecast:
    get:
      summary: Stored forecast for a single instrument & horizon
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "IDX:TLKM"
        - name: h
          in: query
          required: false
          schema: { type: integer, enum: [7, 30], default: 7 }
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forecast" }
        "400": { description: Invalid horizon parameter (must be 7 or 30) }
        "401": { description: Unauthorized }
        "404": { description: Instrument or forecast not found }
  /v1/instruments/{id}/history:
    get:
      summary: Historical actual prices + walk-forward series (backtest)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
        "401": { description: Unauthorized }
  /v1/admin/refresh:
    post:
      summary: Trigger ingestion + ComputeForecast (admin)
      security:
        - adminApiKey: []
      responses:
        "202": { description: Accepted }
        "401": { description: Invalid API key }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminApiKey:
      type: apiKey
      in: header
      name: X-Admin-Api-Key
  schemas:
    User:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        picture_url: { type: string }
    AuthConfig:
      type: object
      properties:
        google_client_id: { type: string }
        dev_login_enabled: { type: boolean }
    SignInResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        session_token: { type: string }
        expires_at: { type: string, format: date-time }
    Instrument:
      type: object
      properties:
        instrument_id: { type: string, example: "IDX:TLKM" }
        symbol: { type: string }
        mic: { type: string, example: "XIDX" }
        currency: { type: string, example: "IDR" }
        timezone: { type: string, example: "Asia/Jakarta" }
        status: { type: string, enum: [active, paused, insufficient_data, delisted] }
        reliability_tier: { type: string, enum: [full, low, insufficient] }
    Volatility:
      type: object
      properties:
        daily: { type: number }
        annualized: { type: number }
        lower: { type: number }
        upper: { type: number }
    CorrectionProbability:
      type: object
      properties:
        theta: { type: number, example: 0.05 }
        probability: { type: number, minimum: 0, maximum: 1 }
        rolling_base_rate: { type: number }
    PathPoint:
      type: object
      properties:
        step: { type: integer }
        median: { type: number }
        lower80: { type: number }
        upper80: { type: number }
        lower95: { type: number }
        upper95: { type: number }
    Forecast:
      type: object
      properties:
        instrument_id: { type: string }
        horizon_days: { type: integer }
        as_of_date: { type: string, format: date }
        status: { type: string, enum: [ok, degraded, failed] }
        reliability_tier: { type: string, enum: [full, low, insufficient] }
        last_price: { type: number }
        median: { type: number }
        lower80: { type: number }
        upper80: { type: number }
        lower95: { type: number }
        upper95: { type: number }
        volatility: { $ref: "#/components/schemas/Volatility" }
        correction: { $ref: "#/components/schemas/CorrectionProbability" }
        path:
          type: array
          items: { $ref: "#/components/schemas/PathPoint" }
        last_successful_update: { type: string, format: date-time }
    History:
      type: object
      properties:
        instrument_id: { type: string }
        actual:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              close: { type: number }
        backtest:
          type: array
          description: Walk-forward (out-of-sample), labeled distinctly from forward forecast
          items:
            type: object
            properties:
              as_of_date: { type: string, format: date }
              horizon_days: { type: integer }
              median: { type: number }
              lower80: { type: number }
              upper80: { type: number }
