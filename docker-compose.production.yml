# Production compose: Postgres/Redis DO NOT expose ports to the host
# (NSG rules allow only 80/443). For local development, use docker-compose.local.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos} -d ${POSTGRES_DB:-kairos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: services/ml-service/Dockerfile
    environment:
      ML_SERVICE_PORT: ${ML_SERVICE_PORT:-50051}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
      ML_SERVICE_HOST: ${ML_SERVICE_HOST:-ml-service}
      ML_SERVICE_PORT: ${ML_SERVICE_PORT:-50051}
      CANONICAL_PARQUET_PATH: /data/canonical.parquet
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      ML_SERVICE_HOST: ${ML_SERVICE_HOST:-ml-service}
      ML_SERVICE_PORT: ${ML_SERVICE_PORT:-50051}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
    depends_on:
      - ml-service
      - redis
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
  caddyconfig:
